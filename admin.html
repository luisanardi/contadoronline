<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Gestão de Empresas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

    <!-- Topo / Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600/10 border border-blue-500/20 flex items-center justify-center text-blue-400 font-bold text-lg">
                    📊
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-tight">Painel Administrativo</h1>
                    <p id="nome-escritorio-topo" class="text-xs font-semibold text-yellow-400 mt-0.5">Carregando escritório...</p>
                </div>
            </div>
            
            <button onclick="fazerLogout()" class="flex items-center space-x-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium transition-colors border border-slate-700">
                <span>Sair / Home</span>
            </button>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-6 py-10">
        
        <!-- Bloco de Cabeçalho da Tabela -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h2 class="text-2xl font-bold tracking-tight text-white">Empresas Clientes</h2>
                <p class="text-sm text-slate-400 mt-1">Gerencie suas empresas e cadastre novos clientes diretamente por aqui.</p>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="abrirModalCadastro()" class="inline-flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold transition-colors shadow-lg shadow-blue-600/25">
                    <span>+ Cadastrar Nova Empresa</span>
                </button>
                <span id="contador-empresas" class="px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 text-sm font-semibold">
                    Carregando...
                </span>
            </div>
        </div>

        <!-- Alerta de Erro -->
        <div id="mensagem-erro" class="hidden mb-6 p-4 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-sm"></div>

        <!-- Tabela de Empresas -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-800 text-xs font-semibold text-slate-400 uppercase tracking-wider bg-slate-950/50">
                            <th class="py-4 px-6">CNPJ</th>
                            <th class="py-4 px-6">Razão Social</th>
                            <th class="py-4 px-6">E-mail da Empresa</th>
                            <th class="py-4 px-6">Data de Cadastro</th>
                            <th class="py-4 px-6 text-right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-empresas-corpo" class="divide-y divide-slate-800/60 text-sm text-slate-300">
                        <!-- Preenchido via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Modal de Cadastro de Empresa -->
    <div id="modal-cadastro" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 shadow-2xl relative">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-white">Cadastrar Nova Empresa</h3>
                <button onclick="fecharModalCadastro()" class="text-slate-400 hover:text-white text-lg font-bold">&times;</button>
            </div>

            <div id="modal-alerta" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

            <form id="form-cadastrar-empresa" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">CNPJ (Consulta Automática)</label>
                    <input type="text" id="empresa-cnpj" required onblur="consultarCnpjAutomatico()" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500" placeholder="00.000.000/0001-00">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Razão Social</label>
                    <input type="text" id="empresa-razao" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500" placeholder="Preenchido automaticamente ao digitar o CNPJ">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">E-mail da Empresa (para receber os dados)</label>
                    <input type="email" id="empresa-email" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500" placeholder="cliente@empresa.com">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Senha de Acesso do Cliente</label>
                    <input type="password" id="empresa-senha" required class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-3 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500" placeholder="••••••••">
                </div>

                <div class="flex justify-end space-x-3 pt-4 border-t border-slate-800">
                    <button type="button" onclick="fecharModalCadastro()" class="px-4 py-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm transition-colors">Cancelar</button>
                    <button type="submit" class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm transition-colors shadow-lg shadow-blue-600/20">Salvar e Enviar E-mail</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('tokenContador');
        const nomeEscritorio = localStorage.getItem('nomeEscritorio');

        if (!token || token === 'null' || token === 'undefined') {
            localStorage.clear();
            window.location.href = 'contador-login.html';
        }

        if (nomeEscritorio) {
            document.getElementById('nome-escritorio-topo').textContent = `Escritório: ${nomeEscritorio}`;
        }

        function fazerLogout() {
            localStorage.clear();
            window.location.href = 'contador-login.html';
        }

        function abrirModalCadastro() {
            document.getElementById('modal-cadastro').classList.remove('hidden');
        }

        function fecharModalCadastro() {
            document.getElementById('modal-cadastro').classList.add('hidden');
            document.getElementById('form-cadastrar-empresa').reset();
            document.getElementById('modal-alerta').classList.add('hidden');
        }

        async function consultarCnpjAutomatico() {
            const inputCnpj = document.getElementById('empresa-cnpj');
            const inputRazao = document.getElementById('empresa-razao');
            const cnpjLimpo = inputCnpj.value.replace(/\D/g, '');

            if (cnpjLimpo.length !== 14) return;

            inputRazao.value = 'Buscando dados na Receita...';

            try {
                const resposta = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpjLimpo}`);
                if (!resposta.ok) throw new Error('CNPJ não encontrado');
                const dados = await resposta.json();
                inputRazao.value = dados.razao_social || dados.nome_fantasia || '';
            } catch (erro) {
                inputRazao.value = '';
                inputRazao.placeholder = 'Digite a Razão Social manualmente';
            }
        }

        async function carregarEmpresas() {
            const corpoTabela = document.getElementById('tabela-empresas-corpo');
            const contadorBadge = document.getElementById('contador-empresas');
            const blocoErro = document.getElementById('mensagem-erro');

            try {
                const resposta = await fetch('/api/empresas', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (resposta.status === 401) {
                    fazerLogout();
                    return;
                }

                const empresas = await resposta.json();
                if (!resposta.ok) throw new Error(empresas.erro || 'Erro ao carregar empresas.');

                contadorBadge.textContent = `${empresas.length} ${empresas.length === 1 ? 'Empresa Cadastrada' : 'Empresas Cadastradas'}`;

                if (empresas.length === 0) {
                    corpoTabela.innerHTML = `
                        <tr>
                            <td colspan="5" class="py-8 text-center text-slate-500">
                                Nenhuma empresa cadastrada no seu escritório ainda. Clique em "+ Cadastrar Nova Empresa" acima.
                            </td>
                        </tr>
                    `;
                    return;
                }

                corpoTabela.innerHTML = '';
                empresas.forEach(empresa => {
                    const dataFormatada = empresa.datacriacao ? new Date(empresa.datacriacao).toLocaleDateString('pt-BR') : '-';
                    const emailEmpresa = empresa.emailempresa || 'Não informado';
                    
                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/40 transition-colors';
                    tr.innerHTML = `
                        <td class="py-4 px-6 font-mono text-slate-400">${empresa.cnpj}</td>
                        <td class="py-4 px-6 font-medium text-white">${empresa.razaosocial}</td>
                        <td class="py-4 px-6 text-slate-400">${emailEmpresa}</td>
                        <td class="py-4 px-6 text-slate-400">${dataFormatada}</td>
                        <td class="py-4 px-6 text-right space-x-2">
                            <a href="admin_upload.html?cnpj=${empresa.cnpj}" class="inline-flex items-center px-3 py-1.5 rounded-lg bg-blue-600/10 hover:bg-blue-600/20 text-blue-400 border border-blue-500/20 text-xs font-semibold transition-colors">
                                Gerenciar Guias
                            </a>
                            <button onclick="deletarEmpresa('${empresa.id}', '${empresa.razaosocial}')" class="inline-flex items-center px-3 py-1.5 rounded-lg bg-red-600/10 hover:bg-red-600/20 text-red-400 border border-red-500/20 text-xs font-semibold transition-colors">
                                Excluir
                            </button>
                        </td>
                    `;
                    corpoTabela.appendChild(tr);
                });

            } catch (erro) {
                blocoErro.textContent = erro.message;
                blocoErro.classList.remove('hidden');
                contadorBadge.textContent = 'Erro';
            }
        }

        // Função para excluir a empresa
        async function deletarEmpresa(idEmpresa, razaoSocial) {
            if (!confirm(`Deseja realmente excluir a empresa "${razaoSocial}"? Todas as guias vinculadas também serão removidas.`)) {
                return;
            }

            try {
                const resposta = await fetch(`/api/empresas/${idEmpresa}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const resultado = await resposta.json();
                if (!resposta.ok) throw new Error(resultado.erro || 'Erro ao excluir empresa.');

                carregarEmpresas();
            } catch (erro) {
                alert(erro.message);
            }
        }

        document.getElementById('form-cadastrar-empresa').addEventListener('submit', async (e) => {
            e.preventDefault();
            const modalAlerta = document.getElementById('modal-alerta');
            
            const cnpj = document.getElementById('empresa-cnpj').value;
            const razaoSocial = document.getElementById('empresa-razao').value;
            const emailEmpresa = document.getElementById('empresa-email').value;
            const senha = document.getElementById('empresa-senha').value;

            try {
                const resposta = await fetch('/api/cadastrar-empresa', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ cnpj, razaoSocial, emailEmpresa, senha })
                });

                const dados = await resposta.json();
                if (!resposta.ok) throw new Error(dados.erro || 'Erro ao cadastrar empresa.');

                modalAlerta.textContent = dados.mensagem;
                modalAlerta.className = 'mb-4 p-3 rounded-lg text-sm bg-emerald-500/10 border border-emerald-500/20 text-emerald-400';
                modalAlerta.classList.remove('hidden');

                setTimeout(() => {
                    fecharModalCadastro();
                    carregarEmpresas();
                }, 1500);

            } catch (erro) {
                modalAlerta.textContent = erro.message;
                modalAlerta.className = 'mb-4 p-3 rounded-lg text-sm bg-red-500/10 border border-red-500/20 text-red-400';
                modalALerta.classList.remove('hidden');
            }
        });

        carregarEmpresas();
    </script>
</body>
</html>
